name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  SDK_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  server-build-test:
    name: Server build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore
        run: dotnet restore MulletaFlix.sln

      - name: Build
        run: dotnet build MulletaFlix.sln --configuration Release --no-restore

      - name: Run unit tests (exclude integration)
        run: >
          dotnet test MulletaFlix.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Integration"
          --verbosity minimal

  web-build:
    name: Web client typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-web-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Install dependencies
        run: npm ci

      # NOTE: tsc --noEmit (build:check) reports ~545 pre-existing type errors
      # and `npm run lint` reports ~3,462 pre-existing eslint errors in legacy
      # playback controllers. Neither has ever been a gate in this project.
      # The production build (esbuild via Vite) is the real gate and passes.
      - name: Production build
        run: npm run build:production
