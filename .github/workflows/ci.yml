name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  SDK_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  server-build-test:
    name: Server build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore
        run: dotnet restore MulletaFlix.sln

      - name: Build
        run: dotnet build MulletaFlix.sln --configuration Release --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list MulletaFlix.sln package --vulnerable --include-transitive

      - name: Run unit tests (exclude integration)
        run: >
          dotnet test MulletaFlix.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Integration"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --verbosity minimal

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: MulletaFlix-master/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  web-build:
    name: Web client typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-web-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The full repository lint has a legacy baseline and is informational;
      # changed frontend files are enforced to prevent new regressions.
      - name: Typecheck
        run: npm run build:check

      - name: Lint changed frontend files
        run: npm run lint:changed

      - name: Production build
        run: npm run build:production

      - name: Unit tests
        run: npm test -- --run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: MulletaFlix-web-master/coverage/**
          if-no-files-found: error

      - name: Verify build artifacts
        run: npm run verify:build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e-smoke:
    name: Playwright isolated stage smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-web-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Restore server dependencies
        working-directory: MulletaFlix-master
        run: dotnet restore MulletaFlix.sln

      - name: Publish isolated stage server
        working-directory: MulletaFlix-master
        run: >
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj
          --configuration Release
          --no-restore
          --self-contained false
          --output ../stage

      - name: Build web client into stage
        shell: bash
        run: |
          npm run build:production
          rm -rf ../stage/MulletaFlix-web
          mkdir -p ../stage/MulletaFlix-web
          cp -a dist/. ../stage/MulletaFlix-web/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run isolated wizard smoke test
        run: npm run playwright -- --grep=Wizard

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: MulletaFlix-web-master/reports/playwright
          if-no-files-found: warn

  supply-chain:
    name: Secret scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: mulletaflix-sbom.spdx.json
          output-file: mulletaflix-sbom.spdx.json

  android-build-test:
    name: Android client tests & assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MulletaFlix-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew test

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mulletaflix-android-debug
          path: MulletaFlix-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mulletaflix-android-release
          path: MulletaFlix-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  ios-build-test:
    name: iOS Core tests & Xcode build
    runs-on: macos-14
    defaults:
      run:
        working-directory: MulletaFlix-iOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate privacy manifest registration
        run: |
          plutil -lint PrivacyInfo.xcprivacy
          test "$(plutil -extract NSPrivacyTracking raw -o - PrivacyInfo.xcprivacy)" = "false"
          plutil -extract NSPrivacyAccessedAPITypes xml1 -o - PrivacyInfo.xcprivacy | grep -q NSPrivacyAccessedAPICategoryUserDefaults
          grep -q "PrivacyInfo.xcprivacy in Resources" MulletaFlix.xcodeproj/project.pbxproj
          grep -q "files = (A00000000000000000000009);" MulletaFlix.xcodeproj/project.pbxproj

      - name: Run Swift package tests
        run: swift test --enable-code-coverage

      - name: Build iOS simulator target
        run: >
          xcodebuild
          -project MulletaFlix.xcodeproj
          -scheme MulletaFlix
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          -resultBundlePath xcodebuild-results.xcresult
          build

      - name: Upload iOS validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mulletaflix-ios-validation
          path: |
            MulletaFlix-iOS/.build/**
            MulletaFlix-iOS/xcodebuild-results.xcresult
          if-no-files-found: warn
