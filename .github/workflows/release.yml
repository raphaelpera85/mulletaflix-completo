name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build Web Client
        working-directory: MulletaFlix-web-master
        run: |
          npm ci
          npm run build:production

      - name: Stage Web Client into stage directory
        shell: pwsh
        run: |
          $stageWeb = "stage/MulletaFlix-web"
          if (Test-Path $stageWeb) { Remove-Item $stageWeb -Recurse -Force }
          New-Item -ItemType Directory -Path $stageWeb -Force | Out-Null
          Copy-Item -Path "MulletaFlix-web-master/dist/*" -Destination $stageWeb -Recurse -Force

      - name: Publish Server Binaries
        shell: pwsh
        run: |
          dotnet publish MulletaFlix-master/Jellyfin.Server/Jellyfin.Server.csproj -c Release -r win-x64 --self-contained false -o stage

      - name: Create Update Archive
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\build-update-package.ps1 -Version $tagVersion -SkipBuild

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MulletaFlix ${{ github.ref_name }}
          body: |
            ### MulletaFlix ${{ github.ref_name }}
            
            - **Roteamento único no Nebula**: toda mídia descoberta para envio ao Telegram termina sob uma única raiz de categoria — filmes em `Filmes`, séries em `Series` e conteúdo adulto em `Porno` — independente da árvore de pastas de origem.
            - **Fim das raízes duplicadas**: caminhos como `Series\Series\...` não são mais criados; a raiz de categoria repetida no início do caminho é descartada tanto no catálogo quanto na geração dos arquivos `.strm`.
            - **Classificação corrigida**: título de filme com "Show", "Temporada" ou "4x100" no nome não é mais tratado como série (ano entre parênteses indica filme), e a pasta-raiz declarada prevalece sobre palavras do título (ex.: "How to Have Sex (2023)" permanece em `Filmes`).
            - **Cobertura de testes**: novos casos de teste para roteamento de filmes guardados em `Series\Filmes`, raízes duplicadas e classificação por pasta declarada.
          files: |
            dist/mulletaflix-update-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
