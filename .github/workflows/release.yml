name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build Web Client
        working-directory: MulletaFlix-web-master
        run: |
          npm ci
          npm run build:production

      - name: Stage Web Client into stage directory
        shell: pwsh
        run: |
          $stageWeb = "stage/MulletaFlix-web"
          if (Test-Path $stageWeb) { Remove-Item $stageWeb -Recurse -Force }
          New-Item -ItemType Directory -Path $stageWeb -Force | Out-Null
          Copy-Item -Path "MulletaFlix-web-master/dist/*" -Destination $stageWeb -Recurse -Force

      - name: Publish Server Binaries
        shell: pwsh
        run: |
          dotnet publish MulletaFlix-master/Jellyfin.Server/Jellyfin.Server.csproj -c Release -r win-x64 --self-contained false -o stage

      - name: Create Update Archive
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\build-update-package.ps1 -Version $tagVersion -SkipBuild

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MulletaFlix ${{ github.ref_name }}
          body: |
            ### MulletaFlix ${{ github.ref_name }}
            
            - **Correção no Nebula Downloader**: Regra de 10% de espaço livre em disco com alternância automática entre as unidades de staging configuradas.
            - **Centro de Atualizações**: Suporte a atualização direta no painel web (`/dashboard/updates`).
            - **Proteção Prévia de Disco**: Verificação de espaço suficiente antes do início de downloads de chunks `.strm`.
          files: |
            dist/mulletaflix-update-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
