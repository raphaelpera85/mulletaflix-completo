name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build and package Linux server
        run: bash tools/release/build-linux-package.sh dist

      - name: Validate Linux archive and service definition
        run: |
          bash -n tools/release/linux-install.sh
          systemd-analyze verify tools/release/mulletaflix.service
          package="$(find dist -maxdepth 1 -name 'mulletaflix_*_linux-x64.tar.gz' -print -quit)"
          test -n "$package"
          tar -tzf "$package" | grep -q '/server/MulletaFlix$'
          tar -tzf "$package" | grep -q '/install.sh$'
          tar -tzf "$package" | grep -q '/server/MulletaFlix-web/index.html$'

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mulletaflix-linux-x64
          path: dist/mulletaflix_*_linux-x64.tar.gz
          if-no-files-found: error

  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download Linux server package
        uses: actions/download-artifact@v4
        with:
          name: mulletaflix-linux-x64
          path: dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build Web Client
        working-directory: MulletaFlix-web-master
        run: |
          npm ci
          npm run build:production

      - name: Stage Web Client into stage directory
        shell: pwsh
        run: |
          $stageWeb = "stage/MulletaFlix-web"
          if (Test-Path $stageWeb) { Remove-Item $stageWeb -Recurse -Force }
          New-Item -ItemType Directory -Path $stageWeb -Force | Out-Null
          Copy-Item -Path "MulletaFlix-web-master/dist/*" -Destination $stageWeb -Recurse -Force

      - name: Publish Server Binaries
        shell: pwsh
        run: |
          dotnet publish MulletaFlix-master/Jellyfin.Server/Jellyfin.Server.csproj -c Release -r win-x64 --self-contained true -o stage -p:DebugSymbols=false -p:DebugType=none -p:GenerateDocumentationFile=false -p:RunAnalyzersDuringBuild=false -p:RunAnalyzers=false

      - name: Create Update Archive
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\build-update-package.ps1 -Version $tagVersion -SkipBuild

      - name: Publish GitHub Release and platform assets
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\publish-release.ps1 -Tag "${{ github.ref_name }}" -Title "MulletaFlix Server ${{ github.ref_name }}" -NotesPath "docs/releases/$tagVersion.md" -AssetsDirectory dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
