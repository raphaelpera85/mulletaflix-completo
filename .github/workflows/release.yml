name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-release-source:
    name: Validate source tag before packaging
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27099:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MULLETAFLIX_TEST_MONGODB_CONNECTION_STRING: mongodb://127.0.0.1:27099/?directConnection=true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore server solution
        working-directory: MulletaFlix-master
        run: dotnet restore MulletaFlix.sln

      - name: Test server solution (exclude external integrations)
        working-directory: MulletaFlix-master
        run: >
          dotnet test MulletaFlix.sln
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName!~Integration"
          --verbosity minimal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Nebula Python test dependencies
        working-directory: MulletaFlix-master/Tools/NebulaPython
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-test.txt

      - name: Test Nebula Python
        working-directory: MulletaFlix-master/Tools/NebulaPython
        run: python -m pytest tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Install web dependencies
        working-directory: MulletaFlix-web-master
        run: npm ci

      - name: Typecheck web client
        working-directory: MulletaFlix-web-master
        run: npm run build:check

      - name: Test web client
        working-directory: MulletaFlix-web-master
        run: npm test -- --run

  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-24.04
    needs: validate-release-source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build and package Linux server
        run: bash tools/release/build-linux-package.sh dist

      - name: Validate Linux archive and service definition
        run: |
          bash -n tools/release/linux-install.sh
          systemd-analyze verify tools/release/mulletaflix.service
          package="$(find dist -maxdepth 1 -name 'mulletaflix_*_linux-x64.tar.gz' -print -quit)"
          test -n "$package"
          tar -tzf "$package" | grep -q '/server/MulletaFlix$'
          tar -tzf "$package" | grep -q '/install.sh$'
          tar -tzf "$package" | grep -q '/server/MulletaFlix-web/index.html$'
          tar -tzf "$package" | grep -q '/server/Tools/NebulaPython/tools/strm_downloader.py$'
          tar -tzf "$package" | grep -q '/server/Tools/NebulaPython/requirements.txt$'
          tar -tzf "$package" | grep -q '/server/Tools/NebulaPython/requirements.lock$'

      - name: Install Nebula Python dependencies without native compiler
        run: bash tools/release/tests/linux-nebula-python-dependencies.test.sh

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mulletaflix-linux-x64
          path: dist/mulletaflix_*_linux-x64.tar.gz
          if-no-files-found: error

  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download Linux server package
        uses: actions/download-artifact@v4
        with:
          name: mulletaflix-linux-x64
          path: dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build Web Client
        working-directory: MulletaFlix-web-master
        run: |
          npm ci
          npm run build:production

      - name: Stage Web Client into stage directory
        shell: pwsh
        run: |
          $stageWeb = "stage/MulletaFlix-web"
          if (Test-Path $stageWeb) { Remove-Item $stageWeb -Recurse -Force }
          New-Item -ItemType Directory -Path $stageWeb -Force | Out-Null
          Copy-Item -Path "MulletaFlix-web-master/dist/*" -Destination $stageWeb -Recurse -Force

      - name: Publish Server Binaries
        shell: pwsh
        run: |
          dotnet publish MulletaFlix-master/Jellyfin.Server/Jellyfin.Server.csproj -c Release -r win-x64 --self-contained true -o stage -p:DebugSymbols=false -p:DebugType=none -p:GenerateDocumentationFile=false -p:RunAnalyzersDuringBuild=false -p:RunAnalyzers=false

      - name: Checkout Windows tray source
        uses: actions/checkout@v4
        with:
          repository: raphaelpera85/mulletaflix-server-windows
          ref: f882f5f2ca7d84322f90b647114667273ee08b21
          path: MulletaFlix-packaging-master/jellyfin-server-windows

      - name: Stage Windows tray and runtime extras
        shell: pwsh
        run: .\MulletaFlix-packaging-master\build-stage-and-installer.ps1 -SkipServerBuild -SkipWebBuild -SkipInstaller

      - name: Create Update Archive
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\build-update-package.ps1 -Version $tagVersion -SkipBuild

      - name: Publish GitHub Release and platform assets
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\publish-release.ps1 -Tag "${{ github.ref_name }}" -Title "MulletaFlix Server ${{ github.ref_name }}" -NotesPath "docs/releases/$tagVersion.md" -AssetsDirectory dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
