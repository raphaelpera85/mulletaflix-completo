name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MulletaFlix-web-master/package-lock.json

      - name: Build Web Client
        working-directory: MulletaFlix-web-master
        run: |
          npm ci
          npm run build:production

      - name: Stage Web Client into stage directory
        shell: pwsh
        run: |
          $stageWeb = "stage/MulletaFlix-web"
          if (Test-Path $stageWeb) { Remove-Item $stageWeb -Recurse -Force }
          New-Item -ItemType Directory -Path $stageWeb -Force | Out-Null
          Copy-Item -Path "MulletaFlix-web-master/dist/*" -Destination $stageWeb -Recurse -Force

      - name: Publish Server Binaries
        shell: pwsh
        run: |
          dotnet publish MulletaFlix-master/Jellyfin.Server/Jellyfin.Server.csproj -c Release -r win-x64 --self-contained false -o stage

      - name: Create Update Archive
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          .\build-update-package.ps1 -Version $tagVersion -SkipBuild

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MulletaFlix ${{ github.ref_name }}
          body: |
            ### MulletaFlix ${{ github.ref_name }}
            
            - **Capas, imagens e NFO preservados no cache**: poster, fanart, logo, thumb, `.nfo`/`.xml` e legendas nunca são removidos do catálogo — nem quando o registro entra em erro — porque são eles que mantêm a biblioteca instantânea no web e no aplicativo.
            - **Staging é fila transitória**: tudo que já foi enviado ao Telegram sai da pasta de staging, inclusive capas e NFO, e pastas que ficam vazias são removidas automaticamente.
            - **Já enviado não volta ao staging**: o exportador de metadados não recria sidecars de uma mídia que já está no Telegram, acabando com as capas e `.nfo` duplicados na pasta de envio.
            - **Sincronização por delta**: a varredura do staging passa a processar somente arquivos novos ou alterados (diário de tamanho+data mais índice em uma única consulta por passada), e a sincronização com o Supabase envia apenas o delta: o que mudou desde o último backup mais o que ainda não foi enviado (fila, staging, envio ou falha).
            - **Restauração não sobrescreve o cache**: a restauração do Supabase mescla campo a campo (`$set`) em vez de substituir o documento, então um registro remoto mais pobre nunca apaga partes do Telegram, caminho local ou metadados locais.
            - **Cobertura de testes**: novos testes para a regra de conteúdo protegido e para a limpeza do staging.
          files: |
            dist/mulletaflix-update-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
