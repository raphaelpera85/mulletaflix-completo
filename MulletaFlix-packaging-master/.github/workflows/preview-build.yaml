name: "MulletaFlix Preview Build"

on:
  workflow_dispatch:
    # Manual trigger (from bot)
    inputs:
      version:
        required: true
        type: string
        description: 'The MulletaFlix stable release tag (i.e. "vX.Y.Z")'
      preview_id:
        required: true
        type: string
        description: 'The numerical preview ID (e.g. 1 for `rc1`)'

env:
  SDK_VERSION: "9.0.x"

permissions:
  contents: read

jobs:
  Docker:
    runs-on: ubuntu-24.04
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for Docker containers"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} docker ${{ env.DEBUG_FLAG }}

  Debian:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release:
          - bullseye
          - bookworm
          - trixie
        arch:
          - amd64
          - arm64
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml debsigs devscripts

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for ${{ matrix.version }} ${{ matrix.arch }}"
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} debian ${{ matrix.arch }} ${{ matrix.release }} ${{ env.DEBUG_FLAG }}
          sudo chown --recursive $USER out/debian

      - name: "Import repository signing GPG key"
        run: |
          echo -n "${{ secrets.DEBIAN_SIGNING_KEY }}" | base64 --decode | gpg --batch --yes --import

      - name: "Sign Debian package and source files"
        run: |
          for file in out/debian/*.deb; do
              debsigs --sign=origin --default-key=${{ secrets.DEBIAN_SIGNING_KEY_ID }} ${file}
          done
          debsign -k ${{ secrets.DEBIAN_SIGNING_KEY_ID }} out/debian/*.changes

      - name: "Remove repository signing GPG key"
        run: |
          gpg --batch --yes --delete-secret-keys ${{ secrets.DEBIAN_SIGNING_KEY_ID }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/debian/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/debian/${{ matrix.release }}/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            export BASEDIR="/srv/repository/main/server/debian"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }} || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/debian/${{ matrix.release }}/${{ matrix.arch }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

  Ubuntu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release:
          - focal
          - jammy
          - noble
          - resolute
        arch:
          - amd64
          - arm64
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml debsigs devscripts

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for ${{ matrix.version }} ${{ matrix.arch }}"
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} ubuntu ${{ matrix.arch }} ${{ matrix.release }} ${{ env.DEBUG_FLAG }}
          sudo chown --recursive $USER out/ubuntu

      - name: "Import repository signing GPG key"
        run: |
          echo -n "${{ secrets.DEBIAN_SIGNING_KEY }}" | base64 --decode | gpg --batch --yes --import

      - name: "Sign Ubuntu package and source files"
        run: |
          for file in out/ubuntu/*.deb; do
              debsigs --sign=origin --default-key=${{ secrets.DEBIAN_SIGNING_KEY_ID }} ${file}
          done
          debsign -k ${{ secrets.DEBIAN_SIGNING_KEY_ID }} out/ubuntu/*.changes

      - name: "Remove repository signing GPG key"
        run: |
          gpg --batch --yes --delete-secret-keys ${{ secrets.DEBIAN_SIGNING_KEY_ID }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/ubuntu/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/ubuntu/${{ matrix.release }}/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            export BASEDIR="/srv/repository/main/server/ubuntu"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }} || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/ubuntu/${{ matrix.release }}/${{ matrix.arch }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

  Linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - amd64-musl
          - arm64
          - arm64-musl
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for ${{ matrix.arch }}"
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} linux ${{ matrix.arch }} ${{ env.DEBUG_FLAG }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/linux/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/linux/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            set -e
            export BASEDIR="/srv/repository/main/server/linux"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }} || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/linux/${{ matrix.release }}/${{ matrix.arch }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

  Windows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    outputs:
      MulletaFlix_VERSION: ${{ steps.version.outputs.MulletaFlix_VERSION }}
      MulletaFlix_RELEASE_TYPE: ${{ steps.version.outputs.MulletaFlix_RELEASE_TYPE }}
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_OUTPUT
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_OUTPUT
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_OUTPUT

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for ${{ matrix.arch }}"
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} windows ${{ matrix.arch }} ${{ env.DEBUG_FLAG }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/windows/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/windows/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            set -e
            export BASEDIR="/srv/repository/main/server/windows"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }} || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/windows/${{ matrix.release }}/${{ matrix.arch }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

      - name: "Store artifacts for next stage"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-artifacts
          retention-days: 1
          if-no-files-found: ignore  # Ignore for arm64 build, as no file will be found
          path: out/windows/MulletaFlix_*-amd64.zip

  WindowsInstaller:
    needs:
      - Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
    continue-on-error: false  # true in prod, false for testing
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: "Set preview version"
        id: version
        shell: pwsh
        run: |
          $version = "${{ needs.Windows.outputs.MulletaFlix_VERSION }}"
          $cleanVersion = $version.Substring(1)
          echo "MulletaFlix_VERSION=$cleanVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Install dependencies"
        run: |-
          python -m pip install --upgrade gitpython

      - name: "Install NSIS"
        uses: negrutiu/nsis-install@9c575d44c2938a43e38a305caeb403de90303c60 # v3
        with:
          distro: official

      - name: "Prepare repository"
        run: |-
          python ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Fetch artifacts from previous stage"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-artifacts
          path: ./MulletaFlix-server-windows

      - name: "Stage bundled UX assets"
        run: |-
          Remove-Item -Recurse -Force .\MulletaFlix-server-windows\MulletaFlix-ux -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force .\MulletaFlix-ux-custom\* .\MulletaFlix-server-windows\MulletaFlix-ux
      - name: "Extract MulletaFlix server archive"
        working-directory: ./MulletaFlix-server-windows
        run: |
          New-Item -ItemType Directory -Path MulletaFlix
          Expand-Archive -Path 'MulletaFlix_*-amd64.zip' -DestinationPath MulletaFlix -Force
          Copy-Item ".\Support Files\LICENSE" -Destination $(Resolve-Path .\MulletaFlix\MulletaFlix)

      - name: "Add NSSM"
        working-directory: ./MulletaFlix-server-windows
        run: |
          Invoke-WebRequest 'https://repo.MulletaFlix.org/files/other/nssm.zip' -OutFile 'nssm.zip'
          Expand-Archive 'nssm.zip'
          Copy-Item ".\nssm\nssm.exe" -Destination $(Resolve-Path .\MulletaFlix\MulletaFlix)
        
      - name: "Publish tray"
        working-directory: ./MulletaFlix-server-windows
        run: |
          New-Item -Path .\MulletaFlix\MulletaFlix\MulletaFlix-windows-tray -ItemType Directory
          dotnet publish -c Release -r win-x64 -f net472 --no-self-contained --output $(Resolve-Path .\MulletaFlix\MulletaFlix\MulletaFlix-windows-tray)

      - name: "Build installer"
        working-directory: ./MulletaFlix-server-windows
        run: |
          $env:InstallLocation = $(Resolve-Path .\MulletaFlix\MulletaFlix)
          makensis /Dx64 /DUXPATH=$(Resolve-Path .\MulletaFlix-ux) $(Join-Path -Path $(Resolve-Path .\nsis) -ChildPath MulletaFlix.nsi)

      - name: "Rename installer"
        working-directory: ./MulletaFlix-server-windows/nsis
        run: |
          Rename-Item -Path .\MulletaFlix_*_windows-x64.exe -NewName ("MulletaFlix_${{ env.MulletaFlix_VERSION }}_windows-x64.exe")
        
      - name: "Store artifacts for next stage"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-artifacts
          retention-days: 1
          if-no-files-found: error
          path: ./MulletaFlix-server-windows/nsis/MulletaFlix_${{ env.MulletaFlix_VERSION }}_windows-x64.exe

  WindowsInstallerUpload:
    needs:
      - Windows
      - WindowsInstaller
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set version from previous job"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ needs.Windows.outputs.MulletaFlix_VERSION }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=${{ needs.Windows.outputs.MulletaFlix_RELEASE_TYPE }}" >> $GITHUB_ENV

      - name: "Fetch artifact from previous stage"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer-artifacts

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "*.exe"
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/windows/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            set -e
            export BASEDIR="/srv/repository/main/server/windows"
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/windows/${{ matrix.arch }}/*.exe

  MacOS:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for ${{ matrix.version }} ${{ matrix.arch }}"
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} macos ${{ matrix.arch }} ${{ env.DEBUG_FLAG }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/macos/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/macos/${{ matrix.arch }}"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            set -e
            export BASEDIR="/srv/repository/main/server/macos"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }} || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/${{ matrix.arch }}/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/macos/${{ matrix.release }}/${{ matrix.arch }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

  Portable:
    runs-on: ubuntu-24.04
    continue-on-error: false  # true in prod, false for testing
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for Portable" 
        run: |-
          sudo --preserve-env ./build.py ${{ env.MulletaFlix_VERSION }} portable ${{ env.DEBUG_FLAG }}

      - name: "Upload artifacts to repository server"
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: "out/portable/*"
          strip_components: 2
          target: "/srv/incoming/server/${{ env.MulletaFlix_VERSION }}/portable"

      - name: "Move artifacts into repository"
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            set -e
            export BASEDIR="/srv/repository/main/server/portable"
            sudo mkdir -p ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/any || exit 1
            sudo mv -t ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }}/any/ /srv/incoming/server/${{ env.MulletaFlix_VERSION }}/portable/${{ matrix.release }}/* || exit 1
            sudo rm ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || true
            sudo ln -sf ${BASEDIR}/${{ env.MulletaFlix_RELEASE_TYPE }}/${{ env.MulletaFlix_VERSION }} ${BASEDIR}/latest-${{ env.MulletaFlix_RELEASE_TYPE }} || exit 1

  Nuget:
    runs-on: ubuntu-24.04
    steps:
      - name: "Set preview version"
        id: version
        run: |-
          echo "MulletaFlix_VERSION=${{ inputs.version }}-rc${{ inputs.preview_id }}" >> $GITHUB_ENV
          echo "MulletaFlix_RELEASE_TYPE=preview" >> $GITHUB_ENV
          echo "DEBUG_FLAG=--debug" >>$GITHUB_ENV

      - name: "Install dependencies"
        run: |-
          sudo apt-get update
          sudo apt-get install --yes python3-git python3-yaml

      - name: "Setup .NET"
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Prepare repository"
        run: |-
          ./checkout.py ${{ inputs.version }}-rc${{ inputs.preview_id }}

      - name: "Run builder for Nuget"
        env:
          NUGET_STABLE_KEY: ${{ secrets.NUGET_STABLE_KEY }}
          NUGET_UNSTABLE_KEY: ${{ secrets.NUGET_UNSTABLE_KEY }}
        run: |-
          ./build.py ${{ env.MulletaFlix_VERSION }} nuget

